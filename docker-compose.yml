version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: 4set_postgres
    environment:
      POSTGRES_DB: 4set_sports
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - 4set_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: 4set_backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: 4set_sports
      DB_USER: postgres
      DB_PASSWORD: postgres123
      JWT_SECRET: your-super-secret-jwt-key-here
    ports:
      - "5001:5000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - 4set_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: 4set_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - 4set_network

volumes:
  postgres_data:

networks:
  4set_network:
    driver: bridge
